<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>问卷调研首页组件原型</title>
  <style>
    :root{--nav:#173c62;--green:#20bc84;--green-dark:#087955;--green-soft:#e9f8f2;--line:#e9edef;--text:#30383d;--muted:#7b858c;--bg:#f3f5f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei",Arial,sans-serif}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:218px 1fr}.side{background:var(--nav);color:#cbd9e4;padding:22px 14px}.brand{height:48px;padding:0 12px;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}.brand i{width:30px;height:30px;border-radius:8px;background:var(--green);display:grid;place-items:center;font-style:normal}.menu{margin-top:18px;display:grid;gap:4px}.menu button{height:44px;border:0;border-radius:7px;background:transparent;color:inherit;padding:0 14px;text-align:left}.menu button.active{background:var(--green);color:#fff;font-weight:700}.main{min-width:0}.top{height:70px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.org strong,.org span{display:block}.org span{margin-top:2px;color:#98a0a5;font-size:12px}.controls{display:flex;gap:12px;align-items:center}.switch{display:flex;padding:3px;border-radius:8px;background:#edf2f3}.switch button{height:32px;border:0;border-radius:6px;background:transparent;color:#657178;padding:0 15px;cursor:pointer}.switch button.active{background:var(--green);color:#fff;font-weight:700}.content{padding:22px}.grid{display:grid;grid-template-columns:minmax(580px,1.3fr) minmax(300px,.7fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 20px rgba(30,50,45,.05);overflow:hidden}.head{height:56px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700}.title i{width:30px;height:30px;border-radius:8px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;font-style:normal}.more{min-height:40px;border:0;background:transparent;color:var(--green-dark);cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.stat{min-height:102px;border:0;border-right:1px solid var(--line);background:#f6fcf9;cursor:pointer}.stat:last-child{border-right:0}.stat:hover{background:#eef9f4}.stat strong,.stat span{display:block}.stat strong{font-size:27px;color:var(--green-dark)}.stat span{margin-top:6px;color:var(--muted);font-size:12px}.rows{padding:0 18px}.row{width:100%;min-height:78px;border:0;border-bottom:1px solid #f0f2f3;background:#fff;display:grid;grid-template-columns:minmax(180px,1fr) 160px 120px 68px;gap:12px;align-items:center;text-align:left;cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:#f8fcfa}.name b,.name small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name small{margin-top:5px;color:#929ba0;font-size:12px}.progress{color:#647078;font-size:12px}.bar{height:6px;margin-top:7px;border-radius:6px;background:#e6edeb;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.deadline{color:#747f85;font-size:12px}.action{justify-self:end;color:var(--green-dark);font-weight:700;font-size:12px}.placeholder{min-height:400px;display:grid;place-items:center;color:#abb2b6}.mobile-stage{min-height:690px;display:grid;place-items:start center;padding:28px}.phone{width:360px;min-height:640px;border:9px solid #253139;border-radius:34px;background:#f1f4f5;box-shadow:0 18px 42px rgba(31,48,56,.16);overflow:hidden}.phone-top{height:74px;padding:16px 18px 12px;background:#fff}.phone-top strong,.phone-top span{display:block}.phone-top span{margin-top:3px;color:#939ca1;font-size:11px}.mobile-home{padding:14px}.mobile-card{background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(31,55,47,.06);overflow:hidden}.mobile-head{height:50px;padding:0 15px;border-bottom:1px solid var(--line);display:flex;align-items:center}.mobile-stat{min-height:150px;background:var(--green-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;cursor:default}.mobile-stat strong{font-size:38px;line-height:1;color:var(--green-dark)}.mobile-stat span{margin-top:10px;color:#56655e;font-size:13px}.mobile-note{padding:0 16px 16px;color:#98a09d;font-size:11px;text-align:center}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:9px 16px;border-radius:20px;background:#27333a;color:#fff;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.top{height:auto;padding:14px;align-items:flex-start}.controls{flex-direction:column;align-items:flex-end;gap:7px}.content{padding:14px}.grid{grid-template-columns:1fr}.placeholder{display:none}.row{grid-template-columns:minmax(160px,1fr) 120px 60px}.deadline{display:none}}@media(max-width:430px){.top{display:block}.controls{margin-top:12px;align-items:stretch}.switch button{flex:1}.mobile-stage{padding:10px 0}.phone{width:100%;min-height:650px;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand"><i>▦</i>问卷调研</div><nav class="menu"><button>首页</button><button class="active">云首页组件</button><button>问卷管理</button><button>全部问卷</button><button>模板中心</button><button>问卷类型</button></nav></aside>
    <main class="main">
      <header class="top"><div class="org"><strong id="orgName">新乡市第一中学</strong><span id="portalLabel">学校云平台 · 云首页组件</span></div><div class="controls"><div class="switch" aria-label="组织端切换"><button data-portal="school" class="active">学校端</button><button data-portal="bureau">教育局端</button></div><div class="switch" aria-label="终端切换"><button data-terminal="pc" class="active">PC端</button><button data-terminal="mobile">移动端</button></div></div></header>
      <section class="content" id="preview"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const state={portal:"school",terminal:"pc"};
    const data={school:{org:"新乡市第一中学",stats:[[2,"待填写"],[1,"待发布"],[3,"进行中"]],mobile:[2,"待填写问卷"],rows:[["教师信息化应用情况调研","市教育局发布","待填写","今日 18:00","去填写",30],["校园安全管理满意度调查","本校发布","进行中","09-03 截止","查看",90],["秋季开学准备情况问卷","本校发布","待发布","待发布","去发布",0]]},bureau:{org:"新乡市教育局",stats:[[6,"进行中调研"],[42,"覆盖学校"],[6,"待提交学校"]],mobile:[6,"待提交学校"],rows:[["秋季开学准备情况调研","36/42 所已提交","待催收","今日 18:00","查看",86],["中小学数字化建设现状调查","41/42 所已提交","进行中","09-04 截止","查看",98],["校园食品安全专项调研","42/42 所已提交","已完成","已结束","查看",100]]}};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function pcView(d){return `<div class="grid"><article class="card"><div class="head"><div class="title"><i>▦</i>问卷调研</div><button class="more" data-action="more">查看更多 ›</button></div><div class="stats">${d.stats.map(x=>`<button class="stat" data-action="stat" data-name="${esc(x[1])}"><strong>${x[0]}</strong><span>${esc(x[1])}</span></button>`).join("")}</div><div class="rows">${d.rows.map(x=>`<button class="row" data-action="row" data-name="${esc(x[0])}"><span class="name"><b>${esc(x[0])}</b><small>${esc(x[1])} · ${esc(x[2])}</small></span><span class="progress">${x[5]?`完成 ${x[5]}%<span class="bar"><i style="width:${x[5]}%"></i></span>`:"尚未开始"}</span><span class="deadline">${esc(x[3])}</span><span class="action">${esc(x[4])} ›</span></button>`).join("")}</div></article><section class="card placeholder"><span>其他首页组件</span></section></div>`}
    function mobileView(d){return `<div class="mobile-stage"><div class="phone"><div class="phone-top"><strong>${esc(state.portal==="school"?"学校云平台":"教育局云平台")}</strong><span>${esc(d.org)}</span></div><div class="mobile-home"><article class="mobile-card" aria-label="问卷调研只读组件"><div class="mobile-head"><div class="title"><i>▦</i>问卷调研</div></div><div class="mobile-stat" aria-label="${esc(d.mobile[1])} ${d.mobile[0]}"><strong>${d.mobile[0]}</strong><span>${esc(d.mobile[1])}</span></div><div class="mobile-note">数据仅展示，不支持点击</div></article></div></div></div>`}
    function render(){const d=data[state.portal];document.querySelectorAll("[data-portal]").forEach(x=>x.classList.toggle("active",x.dataset.portal===state.portal));document.querySelectorAll("[data-terminal]").forEach(x=>x.classList.toggle("active",x.dataset.terminal===state.terminal));document.querySelector("#orgName").textContent=d.org;document.querySelector("#portalLabel").textContent=`${state.portal==="school"?"学校":"教育局"}云平台 · 云首页组件`;document.querySelector("#preview").innerHTML=state.terminal==="pc"?pcView(d):mobileView(d)}
    function toast(text){const el=document.querySelector("#toast");el.textContent=text;el.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove("show"),1500)}
    document.addEventListener("click",e=>{const portal=e.target.closest("[data-portal]"),terminal=e.target.closest("[data-terminal]"),action=e.target.closest("[data-action]");if(portal){state.portal=portal.dataset.portal;render();return}if(terminal){state.terminal=terminal.dataset.terminal;render();return}if(action&&state.terminal==="pc")toast(action.dataset.action==="more"?"进入问卷列表":`进入${action.dataset.name||"问卷"}`)});
    render();
  </script>
</body>
</html>
