    .school-home-icon.outgoing{background:#fff3e3;color:#ff963f}.school-home-icon.incoming{background:#e7fbf1;color:#18b889}.school-home-icon.report{background:#eaf5ff;color:#3878f2}.school-home-icon.bureau{background:#f1ecff;color:#7c5ce5}
    .school-home-stat strong{display:block;font-size:28px;line-height:1.15;font-weight:500;color:#30343b}.school-home-stat span{display:block;margin-top:7px;color:#7a8290;white-space:nowrap}
    @media(max-width:1350px){.school-home-top{grid-template-columns:1fr}.school-home-panel{min-height:120px}}
    @media(max-width:760px){.school-home-actions,.school-home-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.school-home-panel{padding:8px}.school-home-action,.school-home-stat{padding:14px 10px}.school-home-stat{min-height:96px}.school-home-action b{font-size:16px}.school-home-icon{width:48px;height:48px;min-width:48px;line-height:1}}
    .chart{height:250px;display:flex;align-items:flex-end;gap:20px;padding:20px 25px 30px;border-left:1px solid #dce4ee;border-bottom:1px solid #dce4ee;position:relative}.bar-group{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;height:100%;position:relative}.bar{width:20px;border-radius:3px 3px 0 0;background:var(--blue)}.bar.alt{background:#69aaf1}.bar.warn{background:#f0a33a}.bar-label{position:absolute;bottom:-23px;color:#667085;font-size:12px;white-space:nowrap}

    .steps{display:flex;gap:0;margin-bottom:18px;overflow:auto}.step{min-width:118px;display:flex;align-items:center;gap:8px;color:#98a2b3}.step:after{content:"";height:1px;background:#d7dee8;flex:1}.step:last-child:after{display:none}.step i{width:27px;height:27px;border-radius:50%;background:#e8edf3;display:grid;place-items:center;font-style:normal}.step.active{color:var(--blue);font-weight:600}.step.active i,.step.done i{background:var(--blue);color:#fff}.step.done{color:#52708e}
    .modal-mask{position:fixed;inset:0;background:#11182775;z-index:20;display:grid;place-items:center}.modal{width:min(760px,92vw);max-height:88vh;background:#fff;border-radius:10px;box-shadow:0 25px 70px #0003;display:flex;flex-direction:column}.modal.wide{width:min(1050px,94vw)}.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700}.modal-body{padding:20px;overflow:auto}.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.close{border:0;background:transparent;font-size:22px;color:#98a2b3}
    .modal-head-tools{display:flex;align-items:center;gap:14px}#prd-overlay .modal-mask{z-index:40;background:#1118278a}
    .page-prd{color:#344054;line-height:1.75}.page-prd h2{margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid #e7ecf4;color:#172033;font-size:18px}.page-prd h2:first-child{margin-top:0}.page-prd h3{margin:14px 0 7px;color:#344054;font-size:15px}.page-prd p{margin:6px 0}.page-prd ul,.page-prd ol{margin:7px 0;padding-left:24px}.page-prd table{margin-top:10px}.page-prd th{background:#eef8f4;color:#245c48}.page-prd td{vertical-align:top}.page-prd .assumption{padding:10px 12px;border-left:3px solid #16b978;background:#f3fbf7;color:#476657}
    .drawer-mask{position:fixed;inset:0;background:#11182766;z-index:19}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(520px,90vw);background:#fff;display:flex;flex-direction:column}.drawer .modal-body{flex:1}
    .toast-wrap{position:fixed;right:22px;top:72px;z-index:50}.toast{background:#fff;border-left:4px solid var(--success);box-shadow:0 8px 28px #0002;border-radius:7px;padding:12px 18px;margin-bottom:8px;min-width:260px}.toast.error{border-left-color:var(--danger)}
    .school-picker{display:grid;grid-template-columns:1fr 1fr;min-height:390px;border:1px solid var(--line)}.school-side{padding:14px;border-right:1px solid var(--line)}.selected-side{padding:14px}.checkrow{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #f0f2f5}.checkrow:hover{background:#f5f9ff}
    .timeline{border-left:2px solid #d9e4f1;margin-left:8px;padding-left:20px}.timeline-item{position:relative;padding:0 0 20px}.timeline-item:before{content:"";position:absolute;left:-26px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:3px solid #dcebfa}.timeline-item small{color:#98a2b3}
    .pagination{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:14px;color:#667085}.pagination button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 9px}.pagination button.active{background:var(--blue);color:#fff}
    .login{min-height:100vh;background:radial-gradient(circle at 78% 25%,#d9eaff 0,#edf5ff 28%,#f5f8fc 62%);display:grid;place-items:center}.login-card{width:900px;max-width:92vw;background:#fff;border-radius:16px;box-shadow:0 24px 80px #0b4f9c28;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden}.login-hero{background:linear-gradient(145deg,#073e77,#1769c2);color:#fff;padding:55px}.login-hero h1{font-size:34px;margin:18px 0}.login-hero p{color:#dcecff;font-size:16px}.login-mark{width:64px;height:64px;border-radius:16px;background:#fff2;display:grid;place-items:center;font-size:34px}.login-form{padding:55px 42px}.login-form h2{margin:0 0 8px;font-size:24px}.portal-cards{display:grid;gap:12px;margin:25px 0}.portal-card{border:1px solid var(--line);border-radius:9px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}.portal-card.active{border-color:var(--blue);background:var(--blue3);box-shadow:0 0 0 2px #1769c21a}.portal-card i{font-style:normal;font-size:24px;color:var(--blue)}

    /* 2026 youthful blue-white visual refresh */
    :root{
      --blue:#2563eb;--blue2:#1746a2;--blue3:#eef4ff;--line:#e7ecf4;--bg:#f5f7fb;
      --text:#172033;--muted:#778196;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;
      --shadow:0 10px 30px rgba(30,64,175,.07);--shadow-hover:0 18px 42px rgba(37,99,235,.13);
      --radius:14px
    }
    *{scrollbar-width:thin;scrollbar-color:#c9d5e8 transparent}
    *::-webkit-scrollbar{width:7px;height:7px}
    *::-webkit-scrollbar-thumb{background:#c9d5e8;border-radius:99px}
    *::-webkit-scrollbar-track{background:transparent}
    body{
      font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);letter-spacing:.01em;
      background:
        radial-gradient(circle at 12% 8%,rgba(91,141,239,.10),transparent 24rem),
        radial-gradient(circle at 88% 88%,rgba(118,170,255,.08),transparent 28rem),
        var(--bg)
    }
    button,input,select,textarea{font:inherit}
    a,button,.btn,.menu a,.quick,.portal-card{transition:all .2s ease}
    .app{grid-template-columns:236px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr)}
    .brand{
      height:64px;padding:0 20px;background:rgba(255,255,255,.94);color:#183153;
      border-right:1px solid rgba(231,236,244,.86);border-bottom:1px solid rgba(231,236,244,.86);
      box-shadow:none;font-size:17px;font-weight:700
    }
    .brand i{
      width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(135deg,#1f6feb,#67a3ff);color:#fff;
      box-shadow:0 8px 18px rgba(37,99,235,.25);font-size:18px
    }
    .topbar{
      min-height:64px;padding:0 22px;background:rgba(255,255,255,.82);
      border-bottom:1px solid rgba(231,236,244,.85);
      box-shadow:0 4px 18px rgba(24,49,83,.035);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
    }
    .topbar .tabs{padding:6px;background:#f2f5fa;border-radius:11px}
    .topbar .tabs button{border:0;background:transparent;border-radius:8px;padding:7px 12px;color:#667085}
    .topbar .tabs button.active{background:#fff;color:var(--blue);box-shadow:0 3px 12px rgba(30,64,175,.10);font-weight:650}
    .sidebar{
      top:64px;width:236px;padding:14px 10px 24px;background:rgba(255,255,255,.93);
      border-right:1px solid rgba(231,236,244,.86);box-shadow:4px 0 22px rgba(30,64,175,.025);
      backdrop-filter:blur(12px)
    }
    .menu-title{margin:18px 12px 8px;color:#9aa4b5;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .menu a{
      min-height:42px;margin:3px 0;padding:0 12px;border-radius:10px;border-left:0;
      color:#485469;font-weight:520
    }
    .menu a:hover{background:#f4f7fc;color:var(--blue);transform:translateX(2px)}
    .menu a.active{
      background:linear-gradient(90deg,#e8f1ff 0%,#f2f7ff 100%);color:var(--blue);
      border-left:0;font-weight:700;box-shadow:inset 3px 0 0 var(--blue)
    }
    .menu a.sub{margin-left:18px;min-height:36px;border-radius:9px;font-size:13px;color:#697386;padding-left:14px}
    .menu a.sub.active{color:var(--blue);background:#edf4ff}
    .menu .icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#f2f5fa;color:#5f6b80;flex:0 0 28px}
    .menu a.active .icon{background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(37,99,235,.10)}
    .menu-group{margin:3px 0;border-radius:12px;overflow:hidden}
    .menu-group-trigger{
      width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;
      display:flex;align-items:center;gap:11px;color:#485469;font-weight:520;text-align:left
    }
    .menu-group-trigger:hover{background:#f4f7fc;color:var(--blue)}
    .menu-group.active .menu-group-trigger{color:var(--blue);font-weight:700}
    .menu-group.active .menu-group-trigger .icon{background:#eef4ff;color:var(--blue);box-shadow:inset 0 0 0 1px #dbe8ff}
    .menu-group.template-group.active .menu-group-trigger{color:var(--success)}
    .menu-group.template-group.active .menu-group-trigger .icon{background:#ecfdf5;color:var(--success);box-shadow:inset 0 0 0 1px #c9f4e3}
    .menu-arrow{margin-left:auto;font-size:16px;line-height:1;transition:transform .2s ease}
    .menu-group.open .menu-arrow{transform:rotate(180deg)}
    .menu-group-items{display:none;padding:2px 0 4px}
    .menu-group.open .menu-group-items{display:block}
    .menu .menu-group-items a.sub{margin:2px 0 2px 44px;min-height:40px;padding:0 14px;color:#475467;font-size:14px}
    .menu .menu-group-items a.sub.active{color:var(--blue);background:#edf4ff;box-shadow:none;font-weight:700}
    .menu .template-group .menu-group-items a.sub.active{color:var(--success);background:#eafaf4}
    .main{padding:22px 24px 30px;overflow:auto}
    .main>*{animation:pageIn .24s ease both}
    @keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .breadcrumb{color:#8b95a7;font-size:12px;margin-bottom:10px}
    .page-head{margin-bottom:18px}
    .page-head h1{font-size:23px;line-height:1.25;letter-spacing:-.02em;margin:0;color:#14213d}
    .card{
      background:rgba(255,255,255,.94);border:1px solid rgba(231,236,244,.9);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:20px
    }
    .card-title{font-size:16px;font-weight:750;color:#1b2a43;margin-bottom:16px}
    .grid{gap:18px}
    .metric{
      min-height:112px;border:1px solid #e7eef9;border-radius:16px;
      background:linear-gradient(145deg,#fff 35%,#f5f9ff 100%);box-shadow:0 10px 28px rgba(30,64,175,.06);
      position:relative;overflow:hidden
    }
    .metric:after{content:"";position:absolute;right:-28px;bottom:-34px;width:105px;height:105px;border-radius:50%;background:#dceaff66}
    .metric:hover,.quick:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
    .metric-icon,.quick i{
      width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#e8f1ff,#f8fbff);
      color:var(--blue);box-shadow:inset 0 0 0 1px #dce9fb
    }
    .metric strong{font-size:28px;letter-spacing:-.03em;color:#15223b}

    else if(a==="generic-success"){closeOverlay();toast(t.dataset.msg||"操作成功")}
    else if(a==="template-add"||a==="template-edit"){const old=db.templates.find(x=>x.id===t.dataset.id);modal(old?"编辑模板":"新增模板",`${tabs(["基本信息","稿纸设置","流程设置"],"基本信息")}<div class="field"><label>模板名称</label><input class="input" id="template-name" style="flex:1" value="${old?.name||""}"></div><p>模板说明</p><textarea class="textarea" style="width:100%"></textarea><div class="steps" style="margin-top:25px">${(t.dataset.kind==="发文"?["拟稿","核稿","会签","签发","编号","套红","签章","分发","传阅","阅读","办结","归档"]:t.dataset.kind==="收文"?["登记","初审","拟办","批办","承办","分发","传阅","阅读","办结","归档"]:["拟稿","会签","签发","承办","办结","归档"]).map((x,i)=>`<div class="step ${i<2?"done":""}"><i>${i+1}</i>${x}</div>`).join("")}</div>`,`<button class="btn" data-close>取消</button><button class="btn primary" id="template-save">发布</button>`,true);document.querySelector("#template-save").onclick=()=>{const name=document.querySelector("#template-name").value.trim();if(!name){toast("请输入模板名称","error");return}if(old)old.name=name;else db.templates.push({id:uid("t"),kind:t.dataset.kind,name,status:"启用",created:now()});save();closeOverlay();render();toast("模板已发布")}}
    else if(a==="template-field-add"){captureTemplateDraft();ui.templateDraft.layout.push({field:t.dataset.field,span:["title","summary"].includes(t.dataset.field)?2:1});render()}
    else if(a==="template-field-move"){captureTemplateDraft();const i=Number(t.dataset.index),j=i+Number(t.dataset.dir);if(j>=0&&j<ui.templateDraft.layout.length)[ui.templateDraft.layout[i],ui.templateDraft.layout[j]]=[ui.templateDraft.layout[j],ui.templateDraft.layout[i]];render()}
    else if(a==="template-field-span"){captureTemplateDraft();const x=ui.templateDraft.layout[Number(t.dataset.index)];x.span=x.span===2?1:2;render()}
    else if(a==="template-field-remove"){captureTemplateDraft();ui.templateDraft.layout.splice(Number(t.dataset.index),1);render()}
    else if(a==="collab-template-save"){captureTemplateDraft();const d=ui.templateDraft,existing=db.templates.find(t=>t.id===d.id);if(!d.name.trim()){toast("请输入模板名称","error");return}if(!d.layout.length){toast("请至少添加一个稿纸字段","error");return}let x=existing;if(!x){x={id:uid("t"),kind:"局校",created:now()};db.templates.push(x)}Object.assign(x,{name:d.name.trim(),description:d.description.trim(),status:d.status,layout:deep(d.layout)});delete x.isDefault;save();ui.templateDraft=null;toast("局校协同模板已保存");go("/templates/局校")}
    else if(a==="template-toggle"){const x=db.templates.find(x=>x.id===t.dataset.id);if(!x)return;const next=x.status==="启用"?(x.kind==="局校"?"停用":"禁用"):"启用",actionName=next;confirmBox(`${actionName}模板`,`确认${actionName}么？`,()=>{x.status=next;save();render();toast(`模板已${actionName}`)})}
    else if(a==="template-delete"){confirmBox("删除模板","确定删除该模板吗？",()=>{db.templates=db.templates.filter(x=>x.id!==t.dataset.id);save();render();toast("模板已删除")})}
    else if(a==="setting-add"||a==="setting-edit"){if(t.dataset.type==="category"){categoryModal(db.settings.categories.find(x=>x.id===t.dataset.id));return}modal(a==="setting-edit"?"编辑":"新增",`<div class="field"><label>名称</label><input class="input" id="setting-name" style="flex:1" placeholder="请输入，最多20字"></div>${t.dataset.type==="seal"?`<div class="upload-zone" style="margin-top:18px"><div>＋<br>Upload<br><small>支持 jpeg/jpg/png，单个文件不超过1M</small></div></div>`:""}`,`<button class="btn" data-close>取消</button><button class="btn primary" data-action="generic-success" data-msg="保存成功">确定</button>`)}
    else if(a==="category-toggle"){const x=db.settings.categories.find(x=>x.id===t.dataset.id);if(!x)return;const next=x.status==="启用"?"禁用":"启用";confirmBox(`${next}分类`,`确定${next}“${esc(x.name)}”吗？`,()=>{x.status=next;save();render();toast(`分类已${next}`)})}
    else if(a==="category-delete"){const x=db.settings.categories.find(x=>x.id===t.dataset.id);if(!x)return;confirmBox("删除分类",`确定删除“${esc(x.name)}”吗？`,()=>{db.settings.categories=db.settings.categories.filter(item=>item.id!==x.id);save();render();toast("分类已删除")})}
    else if(a==="school-picker")schoolPicker()
    else if(a==="save-collab")saveCollab(false)
    else if(a==="submit-collab")saveCollab(true)
    else if(a==="delete-collab-draft"){
      const d=db.collab.find(x=>x.id===t.dataset.id);
      if(!d||d.status!=="草稿"){toast("仅草稿支持删除","error");render();return}
      confirmBox("删除草稿",COLLAB_DRAFT_DELETE_PROMPT,()=>{const current=db.collab.find(x=>x.id===t.dataset.id);if(!current||current.status!=="草稿"){render();toast("仅草稿支持删除","error");return}db.collab=db.collab.filter(x=>x.id!==current.id);save();render();toast("删除成功")})
    }
    else if(a==="withdraw")confirmBox("撤回公文","撤回后学校将不能继续签收，确定撤回吗？",()=>{const d=db.collab.find(x=>x.id===t.dataset.id);d.status="已撤回";d.logs.push(`${now()} 公文已撤回`);save();render();toast("公文已撤回")})
    else if(a==="remind-one"){const d=db.collab.find(x=>x.id===t.dataset.doc),s=db.schools.find(x=>x.id===t.dataset.school);if(!d||d.status!=="已分发"||d.receipts[t.dataset.school]?.signed){toast("该学校当前不可催办","error");return}confirmBox("催办确认",`确定催办 ${s.name} 尽快签收当前公文吗？`,()=>{recordReminders(d,[s.id]);render();toast("催办已发送")})}
    else if(a==="batch-remind"){const d=db.collab.find(x=>x.id===t.dataset.id),ids=[...document.querySelectorAll(".progress-check:checked")].map(x=>x.value);if(!ids.length){toast("请先勾选未签收学校","error");return}confirmBox("批量催办",`确定催办已选的 ${ids.length} 所学校吗？`,()=>{const n=recordReminders(d,ids);render();toast(`已向${n}所学校发送催办`)})}
    else if(a==="all-remind"){const d=db.collab.find(x=>x.id===t.dataset.id),ids=d.targets.filter(id=>!d.receipts[id]?.signed);if(!ids.length){toast("当前没有未签收学校");return}confirmBox("一键催办",`确定催办全部 ${ids.length} 所未签收学校吗？`,()=>{const n=recordReminders(d,ids);render();toast(`已向${n}所学校发送催办`)})}
    else if(a==="receipt-view")receiptModal(t.dataset.doc,t.dataset.school)
    else if(a==="export-receipts"){const docs=db.collab.filter(d=>d.id===t.dataset.doc);exportCSV([["公文","学校","签收人","签收时间"],...docs.flatMap(d=>Object.entries(d.receipts||{}).filter(([,r])=>r.signed).map(([id,r])=>[d.title,db.schools.find(s=>s.id===id)?.name,r.signer,r.signTime]))],"签收回执.csv")}
    else if(a==="sign"){
      const d=db.collab.find(x=>x.id===t.dataset.id);
      if(db.portal!=="school"||!hasPermission("collab:sign")||!canAccessSchoolCollab(d)){toast("当前用户无签收权限","error");return}
      if(d.status!=="已分发"){toast("该公文当前不可签收","error");return}
      if(d.receipts[db.schoolId]?.signed){toast("该公文已签收，请勿重复操作","error");return}
      incomingSignModal(d)
    }
    else if(a==="confirm-incoming-sign"){
      const d=db.collab.find(x=>x.id===t.dataset.id);
      if(db.portal!=="school"||!hasPermission("collab:sign")||!canAccessSchoolCollab(d)||d.receipts[db.schoolId]?.signed){closeOverlay();toast("该公文当前不可签收","error");return}
      const old=d.receipts[db.schoolId]||{},signer=currentUserName(),signTime=now(),signOpinion=Array.from(document.querySelector("#incoming-sign-opinion")?.value.trim()||"").slice(0,200).join("");
      d.receipts[db.schoolId]={signed:true,signer,signTime,signOpinion,remindCount:old.remindCount||0,lastRemindTime:old.lastRemindTime||""};d.logs.push(`${signTime} ${currentOrg()}由${signer}完成签收`);db.logs.unshift({time:signTime,user:signer,action:"签收教育局来文",object:d.title});save();closeOverlay();go("/incoming");render();toast("签收成功，教育局端已同步更新")
    }
  });
  document.addEventListener("change",e=>{
    if(e.target.id==="role-switch"){db.userRole=e.target.value;save();render();toast("角色权限已切换")}
    if(e.target.id==="check-all-school")document.querySelectorAll(".progress-check:not(:disabled)").forEach(x=>x.checked=e.target.checked)
    if(e.target.id==="category-check-all")document.querySelectorAll(".category-check").forEach(x=>x.checked=e.target.checked)
  });
  document.addEventListener("input",e=>{
    if(e.target.id==="ct-name"){ui.templateDraft.name=e.target.value;const n=document.querySelector("#ct-name-count");if(n)n.textContent=`${e.target.value.length} / 50`}
    if(e.target.id==="ct-desc"){ui.templateDraft.description=e.target.value;const n=document.querySelector("#ct-desc-count");if(n)n.textContent=`${e.target.value.length} / 200`}
    if(e.target.id==="incoming-sign-opinion"){const chars=Array.from(e.target.value);if(chars.length>200)e.target.value=chars.slice(0,200).join("");const n=document.querySelector("#incoming-sign-opinion-count");if(n)n.textContent=`${Array.from(e.target.value).length} / 200`}
    if(ui.collabDraft&&e.target.id?.startsWith("collab-"))captureCollabDraft()
  });
  window.addEventListener("hashchange",()=>{const p=route(),dp=decodeURIComponent(p);ui.page=1;ui.drafting=false;ui.draftTab="稿纸信息";if(p!=="/dashboard")ui.dashboardViewTracked=false;ui.tab=dp.startsWith("/library/局校发文")?(queryParam("tab")||"全部公文"):p==="/progress"?"全部学校":"未办理";ui.openMenu=p.startsWith("/templates/")?"templates":p.startsWith("/manage/")||p.startsWith("/incoming")||p==="/collab"?"manage":p.startsWith("/library/")||p==="/archive"?"library":"";if(p==="/collab/detail"||dp==="/library/局校发文/detail"||p==="/incoming/detail")ui.collabDetailTab="稿纸";if(p==="/collab/edit"){ui.selectedSchools=[];ui.collabFilesKey=null;ui.collabDraft=null;ui.collabEditTab="稿纸信息"}if(decodeURIComponent(p)!=="/templates/局校/edit")ui.templateDraft=null;render()});
  window.GWPrototype={
    queryDocuments:filters=>db.internal.concat(db.collab).filter(d=>Object.entries(filters||{}).every(([k,v])=>!v||d[k]===v)),
    saveDocument:d=>{db.internal.push(d);save()},
    submitDocument:id=>{const d=db.internal.find(x=>x.id===id);if(d)d.status="审核中";save()},
    dispatchDocument:id=>{const d=db.collab.find(x=>x.id===id);if(d&&d.templateSnapshot){d.status="已分发";d.dispatchTime=now();d.targets.forEach(s=>d.receipts[s]={signed:false,signer:"",signTime:"",remindCount:0,lastRemindTime:""})}save()},
    signDocument:(id,sid)=>{const d=db.collab.find(x=>x.id===id);if(d&&d.status==="已分发"&&d.targets.includes(sid)&&!d.receipts[sid]?.signed)d.receipts[sid]={signed:true,signer:"当前用户",signTime:now(),remindCount:d.receipts[sid]?.remindCount||0,lastRemindTime:d.receipts[sid]?.lastRemindTime||""};save()},
    remindSchools:(id,ids)=>{const d=db.collab.find(x=>x.id===id);return d?recordReminders(d,ids):0},
    withdrawDocument:id=>{const d=db.collab.find(x=>x.id===id);if(d)d.status="已撤回";save()},
    exportData:exportCSV
  };

})();
</script>
